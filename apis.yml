name: Brinqa
description: >-
  Brinqa is an AI-powered vulnerability and exposure management platform that
  unifies cyber risk data from across an enterprise's security tools into a
  single trusted data model. It ingests and correlates exposure findings from
  scanners and connectors, deduplicates them, and applies risk scoring, custom
  risk factors, and workflow automation to prioritize and drive remediation.
  The Brinqa Platform exposes a GraphQL API and the Brinqa Query Language (BQL)
  for traversing an entity-relationship graph of assets, findings, hosts,
  tickets, and vulnerabilities, plus reporting and dashboards on those datasets.
  This API Evangelist profile was seeded from an Insight Partners portfolio lead
  and enriched from Brinqa's public developer documentation.
